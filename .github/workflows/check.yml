name: Check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dsfmp-app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          # Node 24 runs the .ts files the tests import without a build step.
          node-version: 24
          cache: npm
          cache-dependency-path: dsfmp-app/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Database tests (PGlite)
        run: npm run test:db
